name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: talent_track
      - name: Build Debug APK
        if: ${{ !secrets.ANDROID_KEYSTORE_BASE64 }}
        run: flutter build apk --debug --no-pub
        working-directory: talent_track
      - name: Prepare signing files
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > talent_track/android/app/release.keystore
          cat > talent_track/android/key.properties <<EOF
          storeFile=android/app/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build Release APK (signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: flutter build apk --release --no-pub
        working-directory: talent_track
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talenttrack-debug-apk
          path: talent_track/build/app/outputs/flutter-apk/app-debug.apk
  release_on_tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_android
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: talenttrack-debug-apk
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-debug.apk
          generate_release_notes: true