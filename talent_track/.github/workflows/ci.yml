name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: talent_track
      - name: Flutter Analyze
        run: flutter analyze
        working-directory: talent_track
      - name: Flutter Test
        run: flutter test --no-pub
        working-directory: talent_track