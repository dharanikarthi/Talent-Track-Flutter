name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: talent_track
      - name: Flutter Analyze
        run: flutter analyze
        working-directory: talent_track
      - name: Flutter Test
        run: flutter test --no-pub
        working-directory: talent_track

  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
